name: Pages

# The documentation site, versioned by `mike` on the `gh-pages` branch (Settings -> Pages must
# serve that branch). A push to master deploys the series __version__ names; `latest` moves only
# for a final release, so unreleased pages never describe settings the released package lacks.

on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
      - 'src/offsite_backup/__init__.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          pip-version: '25.1'
      - run: pip install --group docs
      - name: The series this site is for
        id: series
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          version = re.search(r"__version__ = '(.+?)'", pathlib.Path('src/offsite_backup/__init__.py').read_text()).group(1)
          series = '.'.join(re.match(r'(\d+)\.(\d+)', version).groups())
          final = re.fullmatch(r'\d+(\.\d+)*(\.post\d+)?', version) is not None
          print(f'series={series}')
          print(f'alias={"latest" if final else ""}')
          PY
      - name: Deploy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mike deploy --push --update-aliases '${{ steps.series.outputs.series }}' ${{ steps.series.outputs.alias }}
          mike set-default --push '${{ steps.series.outputs.alias || steps.series.outputs.series }}'

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade 'pip>=25.1'
      # every extra here: mypy checks every backend, and a driver it cannot resolve is a module it cannot check
      - run: pip install -e '.[all]' --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ['5.2', '6.0', '6.1']
        exclude:
          # Django 6.x requires Python 3.12+
          - {python-version: '3.10', django-version: '6.0'}
          - {python-version: '3.11', django-version: '6.0'}
          - {python-version: '3.10', django-version: '6.1'}
          - {python-version: '3.11', django-version: '6.1'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: pip install -e '.[all]' --group dev 'django~=${{ matrix.django-version }}.0'
      - run: python -m pytest -q --cov --cov-report=term-missing:skip-covered

  without-extras:
    # each extra absent in turn: the package, every other backend and the suite must not need it
    name: without extras (${{ matrix.installed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installed: ['none', 's3', 'telegram', 'aiogram', 'pyrage']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: |
          if [ '${{ matrix.installed }}' = 'none' ]; then target='.'; else target='.[${{ matrix.installed }}]'; fi
          pip install -e "$target" --group test
      - run: python -m pytest -q

  test-floors:
    # the declared minimums, which the matrix never installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
          pip-version: '25.1'
      - run: pip install -e '.[s3,telegram,pyrage]' --group test 'django==5.2.0' 'boto3==1.34.0' 'httpx2==2.0.0' 'pyrage==1.2.3'
      - run: python -m pytest -q

  integration:
    # a whole cycle against real services: backup -> restore into a clean database -> row counts
    # match; media volumes byte for byte; Object Lock read back; rotation over real versions
    name: integration (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ob
          POSTGRES_PASSWORD: ob
          POSTGRES_DB: source
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install age, zstd and the PostgreSQL ${{ matrix.postgres }} client
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q age zstd postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      # a step, not a service: a service container cannot be given a command, and MinIO needs `server`
      - name: Start an S3 server with Object Lock
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 \
            cgr.dev/chainguard/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - run: PGPASSWORD=ob psql -h 127.0.0.1 -U ob -d source -c 'CREATE DATABASE target'
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: pip install -e '.[s3,pyrage]' --group test
      - run: pg_dump --version
      # a skipped case is a silent pass, and this leg exists to run every one of them; the
      # Docker volume cases use the runner's own daemon, the MySQL ones have a job of their own
      - name: Integration suite, nothing skipped
        run: |
          set -o pipefail
          python -m pytest -q -rs -m 'integration and not mysql' --ds=tests.integration_settings tests/integration | tee pytest.log
          if grep -q 'skipped' pytest.log; then echo '::error::an integration case was skipped'; exit 1; fi
        env:
          OFFSITE_BACKUP_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OFFSITE_BACKUP_TEST_PG_PORT: '5432'
          OFFSITE_BACKUP_TEST_DOCKER: '1'
      # pyrage against the age binary, both ways: the unit legs have no age to compare with
      - name: pyrage and age interoperate, nothing skipped
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_pyrage.py | tee pyrage.log
          if grep -q 'skipped' pyrage.log; then echo '::error::a pyrage case was skipped'; exit 1; fi

  integration-mysql:
    # dump with the server's own client, restore into an empty database, every row and byte compared
    name: integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - {name: 'mysql 8.4', image: 'mysql:8.4', client: mysql, package: mysql-client, ping: mysql}
          - {name: 'mariadb 11.4', image: 'mariadb:11.4', client: mariadb, package: mariadb-client, ping: mariadb}
    services:
      mysql:
        image: ${{ matrix.server.image }}
        env:
          MYSQL_ROOT_PASSWORD: ob
          MARIADB_ROOT_PASSWORD: ob
        ports: ['3306:3306']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install age, zstd and the ${{ matrix.server.client }} client
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q age zstd ${{ matrix.server.package }}
      - name: Wait for the server
        run: |
          for attempt in $(seq 1 45); do
            MYSQL_PWD=ob ${{ matrix.server.ping }} -h 127.0.0.1 -P 3306 -uroot -e 'SELECT 1' && exit 0
            sleep 2
          done
          exit 1
      - run: python -m pip install --upgrade 'pip>=25.1'
      - run: pip install -e . --group test
      - name: MySQL integration suite, nothing skipped
        run: |
          set -o pipefail
          python -m pytest -q -rs -m mysql tests/integration/test_mysql.py | tee pytest.log
          if grep -q 'skipped' pytest.log; then echo '::error::an integration case was skipped'; exit 1; fi
        env:
          OFFSITE_BACKUP_TEST_MYSQL_PORT: '3306'
          OFFSITE_BACKUP_TEST_MYSQL_PASSWORD: ob
          OFFSITE_BACKUP_TEST_MYSQL_CLIENT: ${{ matrix.server.client }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
          pip-version: '25.1'
      - run: pip install --group docs
      - run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: bash scripts/smoke_install.sh dist
